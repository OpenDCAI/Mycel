events {}

http {
  server {
    listen 8000;

    location /rest/v1/ {
      proxy_pass http://postgrest:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_redirect off;
    }

    location = /rest/v1 {
      return 308 /rest/v1/;
    }

    location / {
      return 404 "local communication profile exposes only /rest/v1\n";
    }
  }
}
